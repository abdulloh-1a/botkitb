name: Render keep-alive

# Render bepul Web Service 15 daqiqa harakatsizlikdan keyin uxlaydi.
# Har 5 daqiqada /health ga so'rov yuborib, botni doimiy uyg'oq ushlab turamiz.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL secret topilmadi. GitHub repo -> Settings -> Secrets -> Actions ga qo'shing."
            exit 1
          fi
          curl -fsS --max-time 120 -o /dev/null -w "HTTP %{http_code}\n" "$RENDER_URL/health"
